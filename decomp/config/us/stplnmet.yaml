# Digimon World 3, USA (SLUS-01436): stplnmet
name: stplnmet
sha1: ee8dbb8cb4f3c1b8db0164e82d4d1f4923878190
options:
  basename: stplnmet
  target_path: disks/us/AAA/PRO/STPLNMET.PRO
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/us/stplnmet
  src_path: src/menus/player_name
  build_path: build/us

  ld_script_path: build/us/generated/stplnmet.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  find_file_boundaries: True

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/us/symbols.txt
    - config/us/symbols_stplnmet.txt

  undefined_funcs_auto_path: build/us/generated/undefined_funcs_auto_stplnmet.txt
  undefined_syms_auto_path: build/us/generated/undefined_syms_auto_stplnmet.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: False

  migrate_rodata_to_functions: True
  create_data_pads: False

segments:
  - name: stplnmet
    type: code
    start: 0x0
    vram: 0x80082448
    vram_symbol: OVERLAY_VRAM
    align: 4
    subalign: 4
    subsegments:
      # each module's rodata: the ones with jump tables or strings
      - [0x0, .rodata, name_entry]
      # the modules (src/menus/player_name/), in the order they link
      - [0x2A8, c, scene]
      - [0x494, c, backdrop]
      - [0xAC4, c, welcome]
      - [0x10B0, c, name_entry]
      - [0x2FEC, c, confirm]
      - [0x40A8, c, choice]
      - [0x4BCC, c, screen]
      # STPLNMET's data, all of it in one file
      - [0x5664, .data, data/stplnmet]
  - [0x6C3C]
