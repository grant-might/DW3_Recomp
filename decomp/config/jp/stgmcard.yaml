# Digimon World 3: Aratanaru Bouken no Tobira, Japan (SLPS-03446): stgmcard
name: stgmcard
sha1: 4288855b78cadf30eb6ffbfe31e9952fefd4ef5e
options:
  basename: stgmcard
  target_path: disks/jp/AAA/PRO/STGMCARD.PRO
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/jp/stgmcard
  src_path: src/menus/memory_card
  build_path: build/jp

  ld_script_path: build/jp/generated/stgmcard.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  find_file_boundaries: True

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/jp/symbols.txt
    - config/jp/symbols_stgmcard.txt

  undefined_funcs_auto_path: build/jp/generated/undefined_funcs_auto_stgmcard.txt
  undefined_syms_auto_path: build/jp/generated/undefined_syms_auto_stgmcard.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: False

  migrate_rodata_to_functions: True
  create_data_pads: False

segments:
  - name: stgmcard
    type: code
    start: 0x0
    vram: 0x80082A60
    vram_symbol: OVERLAY_VRAM
    align: 4
    subalign: 4
    subsegments:
      # us's modules, each with its rodata, data and bss (tools/split_version.py)
      - [0x0, .rodata, menu]
      - [0x20, c, scene]
      - [0x408, c, info]
      - [0xEE0, c, panel]
      - [0x1414, c, menu]
      - [0x1D50, c, saves]
      - [0x49FC, c, screen]
      - [0x525C, .data, data/stgmcard]
  - [0x5B24]
