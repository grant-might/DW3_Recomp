# Digimon World 2003, Europe (SLES-03936): stcrdshp
name: stcrdshp
sha1: d1e01bd598694a6aa8ddd0978f6d382fa970d314
options:
  basename: stcrdshp
  target_path: disks/eu/AAA/PRO/STCRDSHP.PRO
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/eu/stcrdshp
  src_path: src/cardgame/card_packs
  build_path: build/eu

  ld_script_path: build/eu/generated/stcrdshp.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  find_file_boundaries: True

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/eu/symbols.txt
    - config/eu/symbols_stcrdshp.txt

  undefined_funcs_auto_path: build/eu/generated/undefined_funcs_auto_stcrdshp.txt
  undefined_syms_auto_path: build/eu/generated/undefined_syms_auto_stcrdshp.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: False

  migrate_rodata_to_functions: True
  create_data_pads: False

segments:
  - name: stcrdshp
    type: code
    start: 0x0
    vram: 0x80082CB0
    vram_symbol: OVERLAY_VRAM
    align: 4
    subalign: 4
    subsegments:
      # us's modules, each with its rodata, data and bss (tools/split_version.py)
      # each module's rodata: the ones with jump tables or strings
      - [0x0, .rodata, pack_open]
      - [0xF4, .rodata, buy]
      - [0x1C4, .rodata, shop]
      # the modules (src/cardgame/card_packs/), in the order they link
      - [0x35C, c, pack_open]
      - [0x2704, c, fader]
      - [0x29C8, c, card_grid]
      - [0x33C4, c, buy]
      - [0x4F2C, c, scene]
      - [0x5050, c, shop]
      # each module's data
      - [0x65D8, .data, pack_open]
      - [0x9E60, .data, buy]
      - [0x9E78, .data, shop]
  - [0xA250]
