# Digimon World 2003, Europe (SLES-03936): shocktst
name: shocktst
sha1: 4d9cef77e2a9d25dfed5ae9e33b666f4de7cedd7
options:
  basename: shocktst
  target_path: disks/eu/AAA/PRO/SHOCKTST.PRO
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/eu/shocktst
  src_path: src/debug/vibration_test
  build_path: build/eu

  ld_script_path: build/eu/generated/shocktst.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  find_file_boundaries: True

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/eu/symbols.txt
    - config/eu/symbols_shocktst.txt

  undefined_funcs_auto_path: build/eu/generated/undefined_funcs_auto_shocktst.txt
  undefined_syms_auto_path: build/eu/generated/undefined_syms_auto_shocktst.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: False

  migrate_rodata_to_functions: True
  create_data_pads: False

segments:
  - name: shocktst
    type: code
    start: 0x0
    vram: 0x80082CB0
    vram_symbol: OVERLAY_VRAM
    align: 4
    subalign: 4
    subsegments:
      # us's modules, each with its rodata, data and bss (tools/split_version.py)
      - [0x0, .rodata, vibration_test]
      - [0xF0, c, vibration_test]
      - [0x1D18, .data, vibration_test]
  - [0x1E44]
