# Digimon World 2003, Europe (SLES-03936): stgdglab
name: stgdglab
sha1: c2b82222d418fbf0a101f7062499ee5719fea7b5
options:
  basename: stgdglab
  target_path: disks/eu/AAA/PRO/STGDGLAB.PRO
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/eu/stgdglab
  src_path: src/menus/digimon_lab
  build_path: build/eu

  ld_script_path: build/eu/generated/stgdglab.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  find_file_boundaries: True

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/eu/symbols.txt
    - config/eu/symbols_stgdglab.txt

  undefined_funcs_auto_path: build/eu/generated/undefined_funcs_auto_stgdglab.txt
  undefined_syms_auto_path: build/eu/generated/undefined_syms_auto_stgdglab.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: False

  migrate_rodata_to_functions: True
  create_data_pads: False

segments:
  - name: stgdglab
    type: code
    start: 0x0
    vram: 0x80082CB0
    vram_symbol: OVERLAY_VRAM
    align: 4
    subalign: 4
    subsegments:
      # us's modules, each with its rodata, data and bss (tools/split_version.py)
      # each module's rodata: the ones with jump tables or strings
      - [0x0, .rodata, recipe_screen]
      - [0x3C, .rodata, entry_panel]
      - [0x58, .rodata, slot_screen]
      - [0x12C, .rodata, menu]
      - [0x1AC, .rodata, party_screen]
      - [0x1DC, .rodata, skill_panel]
      - [0x280, .rodata, entry_list]
      # the modules (src/menus/digimon_lab/), in the order they link
      - [0x298, c, scene]
      - [0x684, c, recipe_screen]
      - [0x27C0, c, entry_panel]
      - [0x43C0, c, slot_screen]
      - [0x5A2C, c, menu]
      - [0x79C0, c, scroll_bar]
      - [0x7C7C, c, party_screen]
      - [0x95C8, c, skill_panel]
      - [0xAB1C, c, entry_list]
      - [0xBE80, c, lab]
      # each module's data
      - [0xC7C0, .data, recipe_screen]
      - [0xC7E0, .data, menu]
      - [0xC7F4, .data, party_screen]
      - [0xC808, .data, lab]
  - [0xD100]
