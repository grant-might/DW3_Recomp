# Digimon World 2003, Europe (SLES-03936): cnty_sel
name: cnty_sel
sha1: 72f2767301b7c07d80f0401f65f1c6838f8a11bf
options:
  basename: cnty_sel
  target_path: disks/eu/AAA/PRO/CNTY_SEL.PRO
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/eu/cnty_sel
  src_path: src/menus/country_select
  asset_path: asm/eu/cnty_sel/bin
  build_path: build/eu

  ld_script_path: build/eu/generated/cnty_sel.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  find_file_boundaries: True

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/eu/symbols.txt
    - config/eu/symbols_cnty_sel.txt

  undefined_funcs_auto_path: build/eu/generated/undefined_funcs_auto_cnty_sel.txt
  undefined_syms_auto_path: build/eu/generated/undefined_syms_auto_cnty_sel.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  # the file does not end on a word: no padding after the data, nor for the
  # (empty) bss
  ld_bss_is_noload: True
  ld_align_section_vram_end: False

  migrate_rodata_to_functions: True
  create_data_pads: False

segments:
  - name: cnty_sel
    type: code
    start: 0x0
    vram: 0x80082CB0
    vram_symbol: OVERLAY_VRAM
    align: 4
    subalign: 4
    subsegments:
      # us's modules, each with its rodata, data and bss (tools/split_version.py)
      - [0x0, .rodata, country_select]
      - [0x38, c, country_select]
      - [0x1710, .data, country_select]
  - [0x177B]
